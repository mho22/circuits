<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Circuits</title>
		<style>
			html, body { margin : 0; height : 100%; overflow : hidden; background : #000000; color : #9e9e9e; font : 12px ui-monospace, monospace; user-select : none; }
			canvas { display : block; width : 100vw; height : 100vh; cursor : crosshair; touch-action : none; }
			canvas.idle { cursor : default; }
			canvas.grab { cursor : grab; }
			nav { position : fixed; top : 12px; left : 12px; right : 12px; display : flex; flex-wrap : wrap; gap : 6px; pointer-events : none; }
			nav button { pointer-events : auto; }
			.group { position : relative; display : flex; }
			.pick { display : flex; justify-content : space-between; min-width : 104px; }
			.pick:not( :last-of-type ) { border-radius : 4px 0 0 4px; }
			.open { padding : 6px 8px; border-left : none; border-radius : 0 4px 4px 0; }
			.menu { position : absolute; top : 100%; left : 0; display : flex; flex-direction : column; box-sizing : border-box; min-width : 100%; margin-top : 4px; padding : 4px; border : 1px solid #2a2a2a; border-radius : 4px; background : #0c0c0c; }
			.menu[ hidden ], .group[ hidden ] { display : none; }
			.menu button { display : flex; justify-content : space-between; border : none; }
			.menu button:hover { color : #e6e6e6; }
			.folder { position : relative; display : flex; flex-direction : column; }
			.folder:has( > .menu:not( [ hidden ] ) ) > button { color : #e6e6e6; }
			.folder > .menu { top : -5px; left : 100%; min-width : calc( 100% + 10px ); margin : 0 0 0 9px; }
			button { padding : 6px 10px; border : 1px solid #2a2a2a; border-radius : 4px; background : #0c0c0c; color : inherit; font : inherit; cursor : pointer; }
			button.active { border-color : #5c5c5c; color : #e6e6e6; }
			button:focus, input:focus { outline : none; }
			kbd { margin-left : 6px; color : #5c5c5c; font : inherit; }
			.files { display : flex; order : 1; gap : 6px; margin-left : auto; }
			button.center { position : fixed; right : 12px; bottom : 12px; display : flex; width : 32px; height : 32px; padding : 0; align-items : center; justify-content : center; }
			button.center:hover { color : #e6e6e6; }
			.mode { position : fixed; right : 52px; bottom : 12px; display : flex; box-sizing : border-box; height : 32px; padding : 0 7px; align-items : center; border : 1px solid #2a2a2a; border-radius : 4px; }
			output { position : fixed; bottom : 12px; left : 12px; }
			output.error { color : #ff5c5c; }
			.context { position : fixed; display : flex; flex-direction : column; min-width : 160px; padding : 4px; border : 1px solid #2a2a2a; border-radius : 4px; background : #0c0c0c; }
			.context button { border : none; text-align : left; }
			.context button:hover { color : #e6e6e6; }
			.editor { position : fixed; display : flex; align-items : center; gap : 4px; padding : 4px 6px; border : 1px solid #5c5c5c; border-radius : 4px; background : #0c0c0c; color : #9e9e9e; }
			.editor input { width : 80px; padding : 0; border : none; background : none; color : #e6e6e6; font : inherit; outline : none; }
			.editor button { padding : 2px 6px; }
			.editor.beside { margin-left : 12px; transform : translateY( -50% ); }
			.maker { position : fixed; bottom : 40px; left : 50%; display : flex; white-space : nowrap; align-items : center; gap : 6px; padding : 6px; border : 1px solid #2a2a2a; border-radius : 4px; background : #0c0c0c; transform : translateX( -50% ); }
			.maker[ hidden ] { display : none; }
			.maker span { padding-left : 6px; }
			.maker input { width : 240px; padding : 5px 8px; border : 1px solid #2a2a2a; border-radius : 4px; background : #000000; color : #e6e6e6; font : inherit; }
			.maker input:focus { border-color : #5c5c5c; }
			.maker > div { display : flex; }
			.maker .menu { top : auto; bottom : 100%; margin : 0 0 4px; }
			.palette { display : flex; gap : 6px; }
			.palette[ hidden ] { display : none; }
			body.sketching nav > :not( .palette ), body.sketching .maker:not( .sketch ) { display : none; }
		</style>
	</head>
	<body>
		<canvas></canvas>
		<nav>
			<div class="files">
				<button class="load">Open</button>
				<button class="save">Save</button>
			</div>
		</nav>
		<input type="file" accept=".circuit" hidden>
		<button class="center" aria-label="Center the view">
			<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5"/><circle cx="8" cy="8" r="1.5"/><path d="M8 0v3M8 13v3M0 8h3M13 8h3"/></svg>
		</button>
		<span class="mode"></span>
		<output></output>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Circuits</title>
		<style>
			html, body { margin : 0; height : 100%; overflow : hidden; background : #000000; color : #9e9e9e; font : 12px ui-monospace, monospace; user-select : none; }
			canvas { display : block; width : 100vw; height : 100vh; cursor : crosshair; touch-action : none; }
			canvas.grab { cursor : grab; }
			nav { position : fixed; top : 12px; left : 12px; right : 12px; display : flex; flex-wrap : wrap; gap : 6px; pointer-events : none; }
			nav button { pointer-events : auto; }
			.group { position : relative; display : flex; }
			.pick { display : flex; justify-content : space-between; min-width : 104px; }
			.pick:not( :last-of-type ) { border-radius : 4px 0 0 4px; }
			.open { padding : 6px 8px; border-left : none; border-radius : 0 4px 4px 0; }
			.menu { position : absolute; top : 100%; left : 0; display : flex; flex-direction : column; min-width : 140px; margin-top : 4px; padding : 4px; border : 1px solid #2a2a2a; border-radius : 4px; background : #0c0c0c; }
			.menu[ hidden ] { display : none; }
			.menu button { display : flex; justify-content : space-between; border : none; }
			.menu button:hover { color : #e6e6e6; }
			button { padding : 6px 10px; border : 1px solid #2a2a2a; border-radius : 4px; background : #0c0c0c; color : inherit; font : inherit; cursor : pointer; }
			button.active { border-color : #5c5c5c; color : #e6e6e6; }
			kbd { margin-left : 6px; color : #5c5c5c; font : inherit; }
			output { position : fixed; bottom : 12px; left : 12px; }
			output.error { color : #ff5c5c; }
			label.editor { position : fixed; display : flex; align-items : center; gap : 4px; padding : 4px 6px; border : 1px solid #5c5c5c; border-radius : 4px; background : #0c0c0c; color : #9e9e9e; }
			label.editor input { width : 80px; padding : 0; border : none; background : none; color : #e6e6e6; font : inherit; outline : none; }
		</style>
	</head>
	<body>
		<canvas></canvas>
		<nav></nav>
		<output></output>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>

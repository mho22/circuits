<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Circuits</title>
		<style>
			html, body { margin : 0; height : 100%; overflow : hidden; background : #000000; color : #9e9e9e; font : 12px ui-monospace, monospace; user-select : none; }
			canvas { display : block; width : 100vw; height : 100vh; cursor : crosshair; touch-action : none; }
			nav { position : fixed; top : 12px; left : 12px; right : 12px; display : flex; flex-wrap : wrap; gap : 6px; pointer-events : none; }
			nav button { pointer-events : auto; }
			button { padding : 6px 10px; border : 1px solid #2a2a2a; border-radius : 4px; background : #0c0c0c; color : inherit; font : inherit; cursor : pointer; }
			button.active { border-color : #5c5c5c; color : #e6e6e6; }
			kbd { margin-left : 6px; color : #5c5c5c; font : inherit; }
			output { position : fixed; bottom : 12px; left : 12px; }
			output.error { color : #ff5c5c; }
			input.editor { position : fixed; width : 80px; padding : 4px 6px; border : 1px solid #5c5c5c; border-radius : 4px; background : #0c0c0c; color : #e6e6e6; font : inherit; outline : none; }
		</style>
	</head>
	<body>
		<canvas></canvas>
		<nav>
			<button data-kind="0">Wire<kbd>W</kbd></button>
			<button data-kind="1">Resistor<kbd>R</kbd></button>
			<button data-kind="2">Battery<kbd>B</kbd></button>
			<button data-kind="3">Ground<kbd>G</kbd></button>
			<button data-kind="4">Capacitor<kbd>C</kbd></button>
			<button data-kind="5">Inductor<kbd>L</kbd></button>
			<button data-kind="6">Switch<kbd>S</kbd></button>
		</nav>
		<output></output>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
